name: Bug report
description: Report a reproducible problem in the Homeport SDK
title: "bug: <short description>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the fields
        below so a maintainer can reproduce and triage the issue quickly.

        **Security issues** should not be filed here — see
        [SECURITY.md](../../SECURITY.md) for coordinated disclosure.

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Output of `pnpm why @nexartis/homeport-sdk` or the `version` from your `package.json`.
      placeholder: "1.2.3"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Where is the SDK running?
      options:
        - Node.js 20.x
        - Node.js 22.x
        - Cloudflare Workers
        - Bun
        - Deno
        - Browser
        - Other (describe in environment field)
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version / environment details
      description: Exact runtime version and any relevant platform info (OS, bundler, framework).
      placeholder: "node v20.11.1 on macOS 14.4 (arm64)"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        The smallest code snippet, command sequence, or link to a repo that
        reliably reproduces the bug. Please remove any secrets or API keys.
      render: typescript
      placeholder: |
        import { HomeportClient } from "@nexartis/homeport-sdk";

        const client = new HomeportClient({ baseUrl: "https://..." });
        await client.agents.list();
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include full error messages, stack traces, and any relevant log output.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, network traces, related issues, or anything else that helps diagnose the problem.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../../CODE_OF_CONDUCT.md).
          required: true
