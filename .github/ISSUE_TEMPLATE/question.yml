name: Question
description: Ask a usage question or request support
title: "question: <short description>"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## Please use GitHub Discussions for questions

        The issue tracker is reserved for bug reports and actionable feature
        requests. Usage questions, integration help, and open-ended
        discussion belong in
        **[GitHub Discussions](https://github.com/Nexartis/homeport-sdk/discussions)**,
        where maintainers and other community members can help.

        If you have already searched Discussions and existing issues and
        still believe your question belongs here, please fill out the form
        below.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you already tried?
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: "1.2.3"

  - type: checkboxes
    id: checked-discussions
    attributes:
      label: Before filing
      options:
        - label: I searched [Discussions](https://github.com/Nexartis/homeport-sdk/discussions) and existing issues for a similar question.
          required: true
        - label: I agree to follow this project's [Code of Conduct](../../CODE_OF_CONDUCT.md).
          required: true
