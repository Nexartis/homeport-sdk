name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dco-check:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every PR commit
        uses: tim-actions/dco@v1.1.0
        with:
          commits: ${{ github.event.pull_request.commits }}
