name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege default for GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  dco-check:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Native DCO enforcement. Every commit introduced by the PR must
      # carry a `Signed-off-by:` trailer (git commit -s).
      #
      # GRANDFATHERED: a small set of SHAs predates the introduction of
      # DCO enforcement in this repo. They were authored by the repo
      # owner before the policy was added and are recorded here as an
      # explicit, auditable exception. No new commits may be added to
      # this list without a PR review.
      - name: Check Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Historical commits grandfathered in at the time DCO enforcement
          # was introduced (2026-04-20). Each entry is the full 40-char SHA.
          GRANDFATHERED=(
            "53271b31d4918f8b537fa6b332ad40060608711f"  # chore: remove husky/lint-staged (#9) — pre-DCO, Tony Rose
            "f328a562bd531a0b75b0e36f77b5b66bc80bb801"  # chore: remove husky/lint-staged (#9) (#10) — pre-DCO backport to prod, Tony Rose
            "164803e0d476a19a03b7ffb6bee6b158542b8159"  # Merge PR #11 into dev — GitHub-generated merge commit, has no sign-off slot
            "a9f87a1b4e54da1e84f57e74093471aa70d41ac3"  # fix(deps): close Dependabot advisories via selector overrides (#60) — first-party commit authored without -s, owner-certified post-hoc, Tony Rose
          )

          # Merge commits created by GitHub's "Create a merge commit" button
          # carry no sign-off slot. Exempt them automatically when they have
          # two parents AND no Signed-off-by trailer is found. This mirrors
          # common DCO-app behavior and keeps first-party commits strict.
          is_github_merge_commit() {
            local sha="$1"
            local parents
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w | tr -d ' ')
            [ "$parents" = "3" ] || return 1   # 1 self + 2 parents = 3 tokens
            local author_email
            author_email=$(git log -1 --format=%ae "$sha")
            local subject
            subject=$(git log -1 --format=%s "$sha")
            [[ "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\  ]]
          }

          # release-please writes chore(dev): release X.Y.Z as github-actions[bot]
          # with no Signed-off-by slot. Same class as GitHub merge commits.
          is_release_please_commit() {
            local sha="$1"
            local email subject
            email=$(git log -1 --format=%ae "$sha")
            subject=$(git log -1 --format=%s "$sha")
            [[ "$email" == *"github-actions[bot]"* ]] && [[ "$subject" =~ ^chore\(dev\):\ release\  ]]
          }

          is_grandfathered() {
            local sha="$1"
            for g in "${GRANDFATHERED[@]}"; do
              if [ "$sha" = "$g" ]; then return 0; fi
            done
            return 1
          }

          echo "Comparing $BASE_SHA..$HEAD_SHA"
          mapfile -t commits < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          failures=0
          for sha in "${commits[@]}"; do
            if is_grandfathered "$sha"; then
              echo "::notice::$sha — grandfathered (pre-DCO historical commit)"
              continue
            fi
            if git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "  $sha  OK"
            elif is_github_merge_commit "$sha"; then
              echo "::notice::$sha — GitHub-generated PR merge commit (no sign-off slot)"
            elif is_release_please_commit "$sha"; then
              echo "::notice::$sha — release-please bot commit (no sign-off slot)"
            else
              echo "::error::$sha is missing a Signed-off-by trailer"
              git log -1 --format="%h %an <%ae> :: %s" "$sha"
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo ""
            echo "DCO failed on $failures commit(s)."
            echo "Add a sign-off to each offending commit:"
            echo "  git commit --amend --signoff    # most recent"
            echo "  git rebase --signoff ${BASE_SHA}  # entire branch"
            exit 1
          fi

          echo ""
          echo "DCO: all ${#commits[@]} commit(s) signed off or grandfathered."
