name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege default for GITHUB_TOKEN (CodeQL advisory).
# pull-requests: read is required by tim-actions/get-pr-commits to
# list the commits on the PR via the REST API.
permissions:
  contents: read
  pull-requests: read

jobs:
  dco-check:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR commits
        id: pr-commits
        uses: tim-actions/get-pr-commits@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Signed-off-by on every PR commit
        uses: tim-actions/dco@v1.1.0
        with:
          commits: ${{ steps.pr-commits.outputs.commits }}
