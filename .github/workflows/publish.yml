# ------------------------------------------------------------------------------
# Publish @nexartis/homeport-sdk to npmjs with SLSA provenance.
#
# Homeport publishes only from a matching v*.*.* tag (cut on `dev` today).
# Do NOT merge Homeport `dev` onto nanda `prod` to publish — those histories
# have no merge-base, and `prod` is still @nexartis/nexartis-nanda-node-sdk
# 1.3.0. Do not reuse bare v1.0.0–v1.3.0 (those are legacy/*).
#
# The job refuses any tree whose package.json name is not
# @nexartis/homeport-sdk, and refuses a tag that does not equal
# v${package.json version}. workflow_dispatch is not a publish trigger.
#
# Authentication (dual-path, whichever matches first):
#   1. OIDC Trusted Publishing — if the npmjs Trusted Publisher config for
#      this package matches (repo = Nexartis/homeport-sdk,
#      workflow = publish.yml, environment = <none>), the publish step will
#      exchange GitHub's OIDC token for a short-lived npm publish credential
#      automatically. No repository secret needed.
#   2. NPM_TOKEN fallback — if an `NPM_TOKEN` repository secret is set, it
#      is written to `$HOME/.npmrc` and npm will use it when OIDC token
#      exchange is unavailable. Must be an npm *Automation* token.
#
# Provenance is signed from GitHub OIDC + sigstore regardless of which auth
# path is used, via `--provenance` and the `id-token: write` job permission.
#
# Note on the CLI: we deliberately invoke `npm publish` (not `pnpm publish`).
# pnpm's publish wrapper does not perform the npm-specific OIDC token
# exchange that Trusted Publishing requires.
# ------------------------------------------------------------------------------
name: Publish to npmjs

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` lets npm fetch an OIDC token from GitHub both for
      # Trusted Publishing auth (preferred) and for SLSA provenance signing
      # via sigstore. `contents: write` is needed to create the GitHub Release
      # for the triggering tag.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard package identity and tag
        id: identity
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$NAME" != "@nexartis/homeport-sdk" ]; then
            echo "::error::publish.yml refuses to publish '$NAME'. This workflow is Homeport-only. nanda prod stays @nexartis/nexartis-nanda-node-sdk and must not use this job."
            exit 1
          fi
          EXPECTED="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match package.json version '${VERSION}' (expected '${EXPECTED}')."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Size limit (optional)
        if: hashFiles('.size-limit.json') != ''
        continue-on-error: true
        run: pnpm dlx -p size-limit -p @size-limit/preset-small-lib size-limit

      - name: Check if version already published
        id: check
        run: |
          if npm view @nexartis/homeport-sdk@${{ steps.identity.outputs.version }} version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      # If an NPM_TOKEN secret is configured, write it into $HOME/.npmrc as a
      # fallback auth path. When OIDC trusted publishing is available, npm
      # prefers the OIDC token exchange and this entry is unused.
      - name: Configure NPM_TOKEN fallback (optional)
        if: steps.check.outputs.already_published == 'false'
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "NPM_TOKEN fallback configured in ~/.npmrc"
          else
            echo "No NPM_TOKEN set; relying on OIDC trusted publishing"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Use `npm publish` (not `pnpm publish`) — npm performs the OIDC token
      # exchange required by npmjs Trusted Publishing. pnpm does not.
      - name: Publish to npmjs (OIDC trusted publishing with SLSA provenance)
        if: steps.check.outputs.already_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: |
          TAG="v${{ steps.identity.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
