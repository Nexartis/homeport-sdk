# ------------------------------------------------------------------------------
# Publish to npmjs with SLSA provenance.
#
# Authentication (dual-path, whichever matches first):
#   1. OIDC Trusted Publishing — if the npmjs Trusted Publisher config for
#      this package matches (repo = Nexartis/homeport-sdk,
#      workflow = publish.yml, environment = <none>), the publish step will
#      exchange GitHub's OIDC token for a short-lived npm publish credential
#      automatically. No repository secret needed.
#   2. NPM_TOKEN fallback — if an `NPM_TOKEN` repository secret is set, it
#      is written to `$HOME/.npmrc` and npm will use it when OIDC token
#      exchange is unavailable. Must be an npm *Automation* token.
#
# Provenance is signed from GitHub OIDC + sigstore regardless of which auth
# path is used, via `--provenance` and the `id-token: write` job permission.
#
# Note on the CLI: we deliberately invoke `npm publish` (not `pnpm publish`).
# pnpm's publish wrapper does not perform the npm-specific OIDC token
# exchange that Trusted Publishing requires, which caused repeated 404s on
# the publish PUT in prior runs even though provenance signing succeeded:
#   - Run 24647311587 (no env):       pnpm publish -> 404
#   - Run 24647530233 (env=npm-publish): pnpm publish -> 404
# See https://github.com/pnpm/pnpm/issues/ (tracking issue) and
# https://docs.npmjs.com/trusted-publishers for background.
#
# Requires one manual bootstrap `npm publish` to claim the package name on
# npmjs before the first CI publish can succeed (already done for 1.1.0).
# ------------------------------------------------------------------------------
name: Publish to npmjs

on:
  push:
    branches:
      - prod
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` lets npm fetch an OIDC token from GitHub both for
      # Trusted Publishing auth (preferred) and for SLSA provenance signing
      # via sigstore. `contents: write` is needed for the git-tag + release
      # fallback steps below.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Size limit (optional)
        if: hashFiles('.size-limit.json') != ''
        continue-on-error: true
        run: pnpm dlx -p size-limit -p @size-limit/preset-small-lib size-limit

      - name: Get package version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        run: |
          if npm view @nexartis/homeport-sdk@${{ steps.version.outputs.version }} version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      # If an NPM_TOKEN secret is configured, write it into $HOME/.npmrc as a
      # fallback auth path. When OIDC trusted publishing is available, npm
      # prefers the OIDC token exchange and this entry is unused.
      - name: Configure NPM_TOKEN fallback (optional)
        if: steps.check.outputs.already_published == 'false'
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "NPM_TOKEN fallback configured in ~/.npmrc"
          else
            echo "No NPM_TOKEN set; relying on OIDC trusted publishing"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Use `npm publish` (not `pnpm publish`) — npm performs the OIDC token
      # exchange required by npmjs Trusted Publishing. pnpm does not.
      - name: Publish to npmjs (OIDC trusted publishing with SLSA provenance)
        if: steps.check.outputs.already_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create git tag
        if: github.ref == 'refs/heads/prod'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -qF "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/prod'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
