# ------------------------------------------------------------------------------
# Publish to npmjs via Trusted Publishing (OIDC + provenance)
#
# Requires one-time npmjs Trusted Publisher config:
#   repo        = Nexartis/nexartis-nanda-node-sdk
#   workflow    = publish.yml
#   environment = npm-publish
# The environment below MUST match the Trusted Publisher config on npmjs.com;
# when they diverge, npm returns a misleading `404 Not Found` on the publish
# PUT (even though provenance signing succeeds). See the original failure at
# https://github.com/Nexartis/nexartis-nanda-node-sdk/actions/runs/24647311587 .
# See https://docs.npmjs.com/trusted-publishers .
#
# Also requires one manual bootstrap `npm publish` to claim the package name
# on npmjs before the first CI publish can succeed.
#
# Identity is derived from GitHub OIDC — no NPM_TOKEN / NODE_AUTH_TOKEN secret
# is used or required.
# ------------------------------------------------------------------------------
name: Publish to npmjs

on:
  push:
    branches:
      - prod
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the `environment` configured on the npmjs Trusted Publisher
    # for this package. Without this, OIDC token validation returns a 404.
    environment: npm-publish
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Size limit (optional)
        if: hashFiles('.size-limit.json') != ''
        continue-on-error: true
        run: pnpm dlx -p size-limit -p @size-limit/preset-small-lib size-limit

      - name: Get package version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        run: |
          if npm view @nexartis/nexartis-nanda-node-sdk@${{ steps.version.outputs.version }} version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npmjs (OIDC trusted publishing with provenance)
        if: steps.check.outputs.already_published == 'false'
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Create git tag
        if: github.ref == 'refs/heads/prod'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -qF "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/prod'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
