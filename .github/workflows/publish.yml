# ------------------------------------------------------------------------------
# Publish to npmjs with provenance.
#
# Authentication: classic NPM automation token (`secrets.NPM_TOKEN`).
# Provenance:    OIDC-signed SLSA provenance attestations are still produced
#                via `--provenance` and `id-token: write`, and are published
#                to the sigstore transparency log alongside the tarball.
#
# Why a token instead of Trusted Publishing?
# The initial OIDC trusted-publisher setup could not be made to match npm's
# configured claims (repeated 404 on the publish PUT even after adding an
# `environment`). We unblocked v1.2.0 via a scoped NPM_TOKEN to keep the
# release pipeline moving; migration back to OIDC trusted publishing is
# tracked as a follow-up (see run 24647530233 for the final failed OIDC run).
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   NPM_TOKEN — an npm *Automation* token scoped to the @nexartis org with
#               publish rights on @nexartis/nexartis-nanda-node-sdk.
#
# Requires one manual bootstrap `npm publish` to claim the package name on
# npmjs before the first CI publish can succeed (already done for 1.1.0).
# ------------------------------------------------------------------------------
name: Publish to npmjs

on:
  push:
    branches:
      - prod
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` still required so `--provenance` can fetch an OIDC
      # token from GitHub and hand it to sigstore for SLSA provenance signing.
      # Auth to the npm registry itself is via NPM_TOKEN, not OIDC.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Size limit (optional)
        if: hashFiles('.size-limit.json') != ''
        continue-on-error: true
        run: pnpm dlx -p size-limit -p @size-limit/preset-small-lib size-limit

      - name: Get package version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        run: |
          if npm view @nexartis/nexartis-nanda-node-sdk@${{ steps.version.outputs.version }} version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      # Write an explicit .npmrc so pnpm sees the token immediately (setup-node
      # already writes one, but tying it to NPM_TOKEN here removes any ambiguity).
      - name: Configure npmjs authentication
        if: steps.check.outputs.already_published == 'false'
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
          echo "always-auth=true" >> "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npmjs (NPM_TOKEN auth + OIDC provenance)
        if: steps.check.outputs.already_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Create git tag
        if: github.ref == 'refs/heads/prod'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -qF "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/prod'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
