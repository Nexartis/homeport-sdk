name: release-please

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          package-name: '@nexartis/homeport-sdk'
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: dev
