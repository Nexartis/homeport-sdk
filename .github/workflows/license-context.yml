# License & copyright conformance gate (Fleet Hardening v1).
# Owner: nexartis-ozzydev/bin/ozzydev-license-scaffold.mjs — regenerate rather
# than hand-edit. Actions are pinned to full SHAs (supply-chain hardening).
name: license-context
on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]
concurrency:
  group: license-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: "22"
      - run: node scripts/license-gate.mjs
