name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - prod

# Least-privilege default for GITHUB_TOKEN (CodeQL advisory).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Size limit (optional)
        if: hashFiles('.size-limit.json') != ''
        run: pnpm dlx size-limit
