# Deploys the TypeDoc-generated API reference for
# @nexartis/nexartis-nanda-node-sdk to the Cloudflare Worker at
# sdk.nandanetwork.link.
#
# Triggers:
#   - Pushes to the `prod` branch (runs after the release-please release PR
#     is merged into `prod`).
#   - Manual dispatch via the Actions tab (for re-publishing docs without a
#     new release).
#
# Required repository secrets (configure under Settings → Secrets and
# variables → Actions):
#   - CLOUDFLARE_API_TOKEN  (scoped: Workers Scripts:Edit, Workers
#                            Routes:Edit, Account Settings:Read, Workers
#                            KV Storage:Edit if needed; zone-scoped to
#                            nandanetwork.link is sufficient for custom
#                            domains)
#   - CLOUDFLARE_ACCOUNT_ID (the Nexartis Cloudflare account ID)
name: Deploy docs site

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to sdk.nandanetwork.link
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://sdk.nandanetwork.link

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      # Build the SDK so TypeDoc can resolve emitted .d.ts types cleanly.
      - name: Build SDK
        run: pnpm run build

      # Generate the API reference into typedoc-site/dist/api per
      # typedoc.json at the repo root. SDK Agent D adds the `docs` script
      # (typedoc) + the typedoc devDependency to the root package.json.
      - name: Generate TypeDoc site
        run: pnpm run docs

      # Copy the branded landing page so the Worker's root "/" has content.
      - name: Stage landing page
        run: |
          mkdir -p typedoc-site/dist
          cp typedoc-site/public/index.html typedoc-site/dist/index.html

      - name: Install docs-site dependencies
        working-directory: typedoc-site
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Deploy to Cloudflare (prod)
        working-directory: typedoc-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:prod
